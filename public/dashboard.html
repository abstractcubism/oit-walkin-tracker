<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue · OIT Walk-ins</title>
<link rel="stylesheet" href="/app.css">
<style>
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tab { border: 0; border-radius: 0; background: none; padding: 12px 18px 11px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; gap: 8px; }
  .tab:hover { background: none; color: var(--black); }
  .tab[aria-pressed="true"] { color: var(--black); border-bottom-color: var(--scarlet); }
  .tab .n { font-family: var(--mono); font-size: .85rem; min-width: 22px; padding: 1px 6px; background: var(--light-gray); color: var(--ink); }
  .tab .n.hot { background: var(--scarlet); color: var(--white); }
  .sound { margin-left: auto; align-self: center; font-weight: 500; font-size: .85rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding-left: 16px; margin-bottom: 0; }

  h2.sec { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
  h2.sec b { font-family: var(--mono); color: var(--ink); font-size: 1rem; letter-spacing: 0; }

  .q { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); }
  .item { display: grid; grid-template-columns: 76px 150px 1fr auto; gap: 18px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .wait { font-family: var(--mono); font-size: 1.25rem; font-weight: 600; }
  .wait small { display: block; font-family: "IBM Plex Sans", sans-serif; font-size: .75rem; color: var(--muted); font-weight: 500; }
  .item.late .wait { color: var(--scarlet); }
  /* Long waits get a word, not just red numbers (WCAG 1.4.1). */
  .flag { display: inline-block; margin-top: 3px; font-family: "IBM Plex Sans", sans-serif; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--white); background: var(--scarlet); padding: 1px 5px; }
  .who { font-family: var(--mono); font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
  .who small { display: block; font-family: "IBM Plex Sans", sans-serif; font-weight: 400; font-size: .8rem; color: var(--muted); }
  .issue small { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .loc { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .acts { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .claimed-by { font-size: .85rem; color: var(--muted); }
  .empty { padding: 36px 18px; color: var(--muted); text-align: center; }

  details { margin-top: 28px; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary h2.sec::after { content: "Show"; margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--scarlet); font-weight: 600; }
  details[open] summary h2.sec::after { content: "Hide"; }
  .done-row { display: grid; grid-template-columns: 76px 150px 1fr auto; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line); color: var(--muted); align-items: center; text-decoration: none; }
  .done-row:hover { background: var(--light-gray); }
  .done-row:last-child { border-bottom: 0; }
  .done-row .who { color: var(--ink); font-size: .95rem; }

  @media (max-width: 720px) {
    .item, .done-row { grid-template-columns: 56px 1fr auto; }
    .item .issue, .done-row .issue { grid-column: 2 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">Walk-in queue</h1>
  <div class="tabs" id="tabs" role="group" aria-label="Show location"></div>
  <h2 class="sec">Waiting <b id="nOpen">0</b></h2>
  <div class="q" id="open"></div>
  <details id="doneBox">
    <summary><h2 class="sec">Finished today <b id="nDone">0</b></h2></summary>
    <div class="q" id="done"></div>
  </details>
</main>
<script src="/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const LATE_MIN = 10;
let me;
let locs = [];
let all = [];
let seen = null;

// Each computer remembers its location tab and sound setting.
const prefs = (() => { try { return JSON.parse(localStorage.getItem('queuePrefs') || '{}'); } catch { return {}; } })();
const savePrefs = () => { try { localStorage.setItem('queuePrefs', JSON.stringify(prefs)); } catch {} };

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch {}
}

async function act(w, action) {
  try {
    await api(`/api/walkins/${w.id}/${action}`, {});
    if (action === 'claim') location.href = `/w/${w.id}`;
    else refresh();
  } catch (e) { toast(e.message); refresh(); }
}

const allTab = () => !prefs.loc; // rows only need a location label on the "All" tab
const short = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);

function openItem(w) {
  const mins = minutesSince(w.created_at);
  const late = w.status === 'waiting' && mins >= LATE_MIN;
  const waited = mins < 1 ? 'now' : mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h${mins % 60}`;
  return el('div', { class: 'item' + (late ? ' late' : ''), 'data-key': w.id + ':' + w.status },
    el('div', { class: 'wait' }, el('span', { 'aria-hidden': 'true' }, waited),
      el('span', { class: 'sr-only' }, mins < 1 ? 'Just arrived' : `Waiting ${ago(w.created_at)}`),
      el('small', {}, fmtTime(w.created_at)), late ? el('span', { class: 'flag' }, 'Long wait') : null),
    el('div', { class: 'who' }, who(w), !w.netid && w.email ? el('small', {}, w.email) : null),
    el('div', { class: 'issue' }, allTab() ? el('div', { class: 'loc' }, w.location) : null,
      w.issue_type || 'Something else', w.description ? el('small', {}, short(w.description, 110)) : null),
    el('div', { class: 'acts' },
      w.status === 'waiting'
        ? el('button', { class: 'primary', 'data-focus': 'claim' + w.id, 'aria-label': `Claim ${who(w)}`, onclick: () => act(w, 'claim') }, 'Claim')
        : el('span', { class: 'claimed-by' }, w.claimed_by === me.email ? 'Yours' : 'Claimed by ' + (w.claimed_by_name || w.claimed_by).split(/[ @]/)[0]),
      el('a', { class: 'btn', 'data-focus': 'open' + w.id, 'aria-label': `Open ${who(w)}`, href: `/w/${w.id}` }, 'Open')));
}

function doneItem(w) {
  return el('a', { class: 'done-row', 'data-focus': 'done' + w.id, href: `/w/${w.id}` },
    el('div', {}, fmtTime(w.created_at)),
    el('div', { class: 'who' }, who(w)),
    el('div', { class: 'issue' }, allTab() ? `${w.location} · ` : '', w.issue_type || 'Something else'),
    el('div', {}, w.status === 'left' ? closedLabel(w) : w.ticket ? el('code', {}, w.ticket) : 'Resolved'));
}

// The queue refreshes every 5 seconds. Redraw only when something changed, and put keyboard
// focus back on the same control afterwards, so keyboard and screen reader users don't lose
// their place (WCAG 2.4.3).
let lastSig = '';
function render() {
  const sig = JSON.stringify([prefs.loc, all, Math.floor(Date.now() / 60000)]);
  if (sig === lastSig) return;
  lastSig = sig;
  const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focus : null;
  draw();
  if (focusKey) { const f = document.querySelector(`[data-focus="${focusKey}"]`); if (f) f.focus(); }
}

function draw() {
  const here = prefs.loc ? all.filter((w) => String(w.location_id) === String(prefs.loc)) : all;
  const open = here.filter((w) => w.status === 'waiting' || w.status === 'claimed')
    .sort((a, b) => (a.status === 'waiting' ? 0 : 1) - (b.status === 'waiting' ? 0 : 1) || a.created_at.localeCompare(b.created_at));
  const done = here.filter((w) => w.status === 'resolved' || w.status === 'left').sort((a, b) => b.created_at.localeCompare(a.created_at));

  const waitingAt = (id) => all.filter((w) => w.status === 'waiting' && (!id || String(w.location_id) === String(id))).length;
  $('tabs').replaceChildren(
    ...[...locs.map((l) => [l.id, l.name]), ['', 'All locations']].map(([id, name]) => {
      const n = waitingAt(id);
      return el('button', { class: 'tab', 'data-focus': 'tab' + id, 'aria-pressed': String(String(prefs.loc || '') === String(id)),
        onclick: () => { prefs.loc = id; savePrefs(); seen = null; lastSig = ''; render(); } }, name,
        el('span', { class: 'n' + (n ? ' hot' : '') }, n, el('span', { class: 'sr-only' }, ' waiting')));
    }),
    el('label', { class: 'sound' }, el('input', { type: 'checkbox', 'data-focus': 'sound', checked: !!prefs.sound, onchange: (e) => { prefs.sound = e.target.checked; savePrefs(); } }), 'Sound'));

  const waiting = open.filter((w) => w.status === 'waiting');
  $('nOpen').textContent = waiting.length;
  $('open').replaceChildren(...(open.length ? open.map(openItem) : [el('div', { class: 'empty' }, 'Nobody waiting.')]));
  $('nDone').textContent = done.length;
  $('done').replaceChildren(...(done.length ? done.map(doneItem) : [el('div', { class: 'empty' }, 'Nothing finished yet today.')]));
  document.title = (waiting.length ? `(${waiting.length}) ` : '') + 'Queue · OIT Walk-ins';

  const fresh = seen ? waiting.filter((w) => !seen.has(w.id)) : [];
  if (fresh.length) {
    announce(fresh.length === 1 ? `New walk-in: ${who(fresh[0])}, ${fresh[0].issue_type || 'Something else'}` : `${fresh.length} new walk-ins`);
    if (prefs.sound) beep();
  }
  seen = new Set(here.map((w) => w.id));
}

async function refresh() {
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  all = await api('/api/walkins?' + new URLSearchParams({ since: midnight.toISOString() }));
  render();
}

(async () => {
  me = await staffNav('/dashboard');
  locs = await api('/api/locations');
  if (prefs.loc && !locs.some((l) => String(l.id) === String(prefs.loc))) prefs.loc = '';
  await refresh();
  setInterval(() => refresh().catch(() => {}), 5000);
})();
</script>
</body>
</html>
