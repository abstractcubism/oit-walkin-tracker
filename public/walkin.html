<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk-in · OIT Walk-ins</title>
<link rel="stylesheet" href="/app.css">
<style>
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; margin: 0; }
  dt { color: var(--muted); font-weight: 600; }
  dl { align-items: baseline; }
  dd { margin: 0; }
  dd.copyable { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  dd.copyable > :first-child { overflow-wrap: anywhere; }
  .page-h h1 { gap: 14px; }
  .page-h h1 .id { font-family: var(--mono); letter-spacing: 0; }  /* ticket numbers and NetIDs: l/1 and O/0 stay distinct */
  .with-copy { display: inline-flex; align-items: center; gap: 4px; }
  .netid { font-family: var(--mono); font-size: 1.8rem; font-weight: 600; }
  .back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600; margin-bottom: 14px; }
  .sn { display: inline-block; margin-top: 10px; font-weight: 600; }
  .notice { background: var(--warn-tint); color: var(--warn); font-weight: 600; border-left: 4px solid var(--yellow); }
  .ticket input { font-size: 1.2rem; width: 200px; text-transform: uppercase; }
  .form-ok { color: var(--ink); font-weight: 600; }
  .form-no { color: var(--scarlet); font-weight: 600; }
  .signed { margin-top: 16px; }
  .signed summary { cursor: pointer; font-weight: 600; }
  .signed .terms p { font-size: .9rem; line-height: 1.45; margin: 8px 0; }
  .signed .sig { display: grid; grid-template-columns: 2fr 1fr; gap: 4px 20px; margin-top: 12px; align-items: end; }
  .signed .sig img { max-width: 100%; height: 80px; object-fit: contain; object-position: left bottom; border-bottom: 1px solid var(--ink); display: block; }
  .signed .sig .val { border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
  .signed .sig .cap { font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
  .signed .office { margin-top: 6px; border: 1px solid var(--line); padding: 10px 14px; display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: .9rem; max-width: 380px; }
  .grid { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } dl { grid-template-columns: 110px 1fr; } }
</style>
</head>
<body>
<main>
  <a class="back" href="/dashboard"><span aria-hidden="true">←</span> Back to queue</a>
  <div id="app"></div>
</main>
<script src="/common.js"></script>
<script src="/icons.js"></script>
<script>
const id = Number(location.pathname.split('/').pop());
let me;

async function act(action, body = {}) {
  try {
    const w = await api(`/api/walkins/${id}/${action}`, body);
    render(w);
    // The button that was pressed is gone after a redraw; move focus to the heading, which now
    // shows the new status, instead of dropping it to the top of the page (WCAG 2.4.3).
    if (!document.activeElement || document.activeElement === document.body) document.getElementById('wh').focus();
    return true;
  } catch (e) {
    toast(e.message);
    load();
    return false;
  }
}

// Red copy icon. The name for screen readers is on aria-label; the tooltip says the same for mouse users.
// After copying, the icon turns into a check for a moment, and the toast announces it (WCAG 4.1.3).
function copyBtn(text, what) {
  const b = el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Copy ' + what, title: 'Copy ' + what }, icon('copy'));
  b.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      toast(`Copied ${what}`);
      b.replaceChildren(icon('check'));
      setTimeout(() => b.replaceChildren(icon('copy')), 1500);
    } catch { toast('Copy failed'); }
  });
  return b;
}

// "More actions" menu button, following the WAI-ARIA menu button pattern: Enter, Space or
// Down Arrow opens it on the first item, Up Arrow on the last; arrows, Home and End move;
// Escape or Tab closes it, and focus goes back to the button.
function menuButton(label, items) {
  const id = 'menu-' + Math.random().toString(36).slice(2, 8);
  const btn = el('button', { type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-controls': id }, label, icon('chevron-down'));
  const entries = items.map(([text, run, title]) => el('li', { role: 'menuitem', tabindex: '-1', title: title || null }, text));
  const menu = el('ul', { class: 'menu', role: 'menu', id, 'aria-label': label, hidden: '' }, entries);
  const wrap = el('div', { class: 'menu-wrap' }, btn, menu);
  const isOpen = () => !menu.hidden;
  const focusItem = (i) => entries[(i + entries.length) % entries.length].focus();
  const open = (i) => { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); focusItem(i); };
  const close = (refocus) => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (refocus) btn.focus(); };
  const choose = (i) => { close(true); items[i][1](); };
  btn.addEventListener('click', () => (isOpen() ? close(true) : open(0)));
  btn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); open(0); }
    if (e.key === 'ArrowUp') { e.preventDefault(); open(entries.length - 1); }
  });
  entries.forEach((li, i) => {
    li.addEventListener('click', () => choose(i));
    li.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'ArrowDown') { e.preventDefault(); focusItem(i + 1); }
      else if (k === 'ArrowUp') { e.preventDefault(); focusItem(i - 1); }
      else if (k === 'Home') { e.preventDefault(); focusItem(0); }
      else if (k === 'End') { e.preventDefault(); focusItem(entries.length - 1); }
      else if (k === 'Escape') { e.preventDefault(); close(true); }
      else if (k === 'Tab') close(false);
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); choose(i); }
    });
  });
  // Clicking or tabbing anywhere outside closes it.
  wrap.addEventListener('focusout', (e) => { if (isOpen() && !wrap.contains(e.relatedTarget)) close(false); });
  return wrap;
}

// The heading names the walk-in by its ServiceNow ticket once one is attached, otherwise by who it is.
const heading = (w) => w.ticket || w.netid || w.name || `Walk-in ${w.id}`;

function render(w) {
  document.title = `${heading(w)} · OIT Walk-ins`;
  const open = w.status === 'waiting' || w.status === 'claimed';
  const mine = w.claimed_by === me.email;

  const ticket = el('input', { id: 'ticket', value: w.ticket || '', placeholder: 'INC0012345', autocomplete: 'off' });
  const notes = el('textarea', { id: 'notes', rows: 4, placeholder: 'Internal notes (optional)' }, w.notes || '');
  const saveTicket = async () => {
    if ((ticket.value.trim().toUpperCase() || null) === (w.ticket || null)) return true;
    const ok = await act('update', { ticket: ticket.value });
    if (ok) toast('Ticket saved');
    return ok;
  };

  // The main step (Claim, Resolve or Reopen) sits on the far right; everything else is in "More actions".
  const more = [];
  if (w.status === 'claimed') more.push([mine ? 'Release' : 'Release claim', () => act('unclaim')]);
  if (open) more.push(['Left / no-show', () => { if (confirm('Mark this walk-in as left without being helped?')) act('left'); }]);
  if (open) more.push(['Fixed it themselves', () => act('left', { reason: 'self_solved' }), 'They sorted it out on their own, e.g. with the self-help link']);
  const actions = [];
  if (more.length) actions.push(menuButton('More actions', more));
  if (w.status === 'waiting') actions.push(el('button', { class: 'primary', onclick: () => act('claim') }, 'Claim'));
  if (w.status === 'claimed') actions.push(el('button', { class: 'primary', onclick: async () => { if (await saveTicket()) act('resolve'); } }, 'Resolve'));
  if (!open) actions.push(el('button', { onclick: () => act('reopen') }, 'Reopen'));

  document.getElementById('app').replaceChildren(...[
    el('div', { class: 'page-h' },
      el('h1', { class: 'row', id: 'wh', tabindex: '-1' }, w.ticket || w.netid ? el('span', { class: 'id' }, heading(w)) : heading(w), chip(w.status)),
      el('div', { class: 'row' }, actions)),
    w.status === 'claimed' && !mine ? el('p', { class: 'card notice', role: 'note' }, `Claimed by ${w.claimed_by_name || w.claimed_by}.`) : null,
    el('div', { class: 'grid' },
      el('div', { class: 'card' },
        el('dl', {},
          w.netid ? [el('dt', {}, 'NetID'), el('dd', { class: 'copyable' }, el('span', { class: 'netid' }, w.netid), copyBtn(w.netid, 'NetID'))] : null,
          w.name ? [el('dt', {}, 'Name'), el('dd', {}, w.name)] : null,
          w.email ? [el('dt', {}, 'Email'), el('dd', { class: 'copyable' }, el('a', { href: 'mailto:' + w.email }, w.email), copyBtn(w.email, 'email'))] : null,
          w.purged_at ? [el('dt', {}, 'Details'), el('dd', { class: 'muted' }, 'Personal details were erased by the retention rule.')] : null,
          el('dt', {}, 'Issue'), el('dd', {}, w.issue_type || el('span', { class: 'muted' }, 'Not picked')),
          el('dt', {}, 'Description'), el('dd', { style: 'white-space:pre-wrap' }, w.description || el('span', { class: 'muted' }, 'None')),
          el('dt', {}, 'Location'), el('dd', {}, w.location),
          me.consentOn || w.consent ? [el('dt', {}, 'Permission form'), el('dd', {}, consentCell(w, open))] : null,
          el('dt', {}, 'Arrived'), el('dd', {}, fmtDateTime(w.created_at)),
          w.claimed_at ? [el('dt', {}, 'Claimed'), el('dd', {}, `${fmtTime(w.claimed_at)} by ${w.claimed_by_name || w.claimed_by} (waited ${minutesSince(w.created_at, w.claimed_at)} min)`)] : null,
          w.closed_at ? [el('dt', {}, closedLabel(w)), el('dd', {}, `${fmtTime(w.closed_at)} ${w.closed_by ? 'by ' + (w.closed_by_name || w.closed_by) : 'on the iPad'}`)] : null)),
      el('div', { class: 'card' },
        el('form', { class: 'ticket', onsubmit: (e) => { e.preventDefault(); saveTicket(); } },
          el('label', { for: 'ticket' }, 'ServiceNow ticket'),
          el('div', { class: 'row' }, el('span', { class: 'with-copy' }, ticket, w.ticket ? copyBtn(w.ticket, 'ticket number') : null), el('button', { type: 'submit' }, 'Save ticket')),
          w.ticket ? el('a', { class: 'sn', href: servicenowLink(me.servicenowUrl, w.ticket), target: '_blank', rel: 'noopener' }, `Open ${w.ticket} in ServiceNow`, el('span', { 'aria-hidden': 'true' }, ' ↗'), el('span', { class: 'sr-only' }, ' (opens in a new tab)')) : null),
        el('div', { style: 'margin-top:16px' },
          el('label', { for: 'notes' }, 'Notes'), notes,
          el('button', { style: 'margin-top:8px', onclick: async () => { if (await act('update', { notes: notes.value })) toast('Notes saved'); } }, 'Save notes')))),
    w.consent === 'signed' && w.consent_text ? signedForm(w) : null].filter(Boolean));
}

function consentCell(w, open) {
  const c = consentState(w);
  return [
    el('span', { class: c.ok ? 'form-ok' : 'form-no' }, c.long),
    w.consent_at && c.ok ? el('span', { class: 'muted' }, ' · ' + fmtDateTime(w.consent_at)) : null,
    !c.ok && open ? el('div', { style: 'margin-top:6px' }, el('button', { class: 'small', title: 'For example after seeing the DocuSign confirmation on their phone',
      onclick: () => { if (confirm('Mark the permission form as signed? Only do this after you have checked it.')) act('consent'); } }, 'Mark as signed')) : null,
  ];
}

// The form signed on the iPad, laid out like the paper one, with the "For office use" box filled in.
function signedForm(w) {
  return el('details', { class: 'card signed' },
    el('summary', {}, 'Signed permission form'),
    el('div', { class: 'terms' }, w.consent_text.split(/\n\s*\n/).map((t) => el('p', {}, t))),
    el('div', { class: 'sig' },
      w.consent_sig ? el('img', { src: w.consent_sig, alt: 'Signature of ' + (w.consent_name || 'the walk-in') }) : el('div', { class: 'val muted' }, '(erased)'),
      el('div', { class: 'val' }, fmtDateTime(w.consent_at)),
      el('div', { class: 'cap' }, 'Signature'), el('div', { class: 'cap' }, 'Date'),
      el('div', { class: 'val' }, w.consent_name || el('span', { class: 'muted' }, '(erased)')), el('div', {}),
      el('div', { class: 'cap' }, 'Print name'), el('div', {})),
    el('div', { class: 'office' },
      el('span', { class: 'muted' }, 'NetID'), el('span', {}, w.netid || '-'),
      el('span', { class: 'muted' }, 'Ticket #'), el('span', {}, w.ticket || '-'),
      el('span', { class: 'muted' }, 'Consultant'), el('span', {}, w.claimed_by ? (w.claimed_by_name || w.claimed_by) : '-')));
}

async function load() {
  try { render(await api(`/api/walkins/${id}`)); } catch (e) {
    document.getElementById('app').replaceChildren(el('p', { class: 'card' }, e.message));
  }
}

(async () => {
  me = await staffNav('/dashboard');
  load();
})();
</script>
</body>
</html>
