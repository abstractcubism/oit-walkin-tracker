<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · OIT Walk-ins</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="auth-bg">
<main class="center" id="main">
  <div class="card signin">
    <div id="brand"></div>
    <h1>OIT Walk-ins</h1>
    <p class="muted">Consultant sign-in</p>
    <div id="buttons"></div>
    <p class="error" id="err" role="alert"></p>
  </div>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  document.getElementById('brand').replaceWith(brandMark());
  const params = new URLSearchParams(location.search);
  const next = params.get('next') && params.get('next').startsWith('/') && !params.get('next').startsWith('//') ? params.get('next') : '/setup';
  // Opened from the iPad's hidden staff exit: give an easy way back if it was by mistake.
  // Same for the TV queue screen.
  const back = { kiosk: ['/kiosk', 'Back to check-in'], tv: ['/tv', 'Back to the queue screen'] }[params.get('from')];
  if (back) {
    document.querySelector('.signin').append(el('a', { class: 'btn', href: back[0], style: 'margin-top:18px' }, el('span', { 'aria-hidden': 'true' }, '←'), back[1]));
    // If nobody signs in within a minute, go back on its own. Any tap or key press restarts the minute.
    let idle = setTimeout(() => { location.href = back[0]; }, 60000);
    ['input', 'touchstart', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, () => {
      clearTimeout(idle); idle = setTimeout(() => { location.href = back[0]; }, 60000);
    }, { passive: true }));
  }
  const err = document.getElementById('err');
  const box = document.getElementById('buttons');
  if (params.get('error')) err.textContent = params.get('error');

  const cfg = await api('/api/auth/config');
  const domains = (d) => d.map((x) => '@' + x).join(' or ');

  if (cfg.microsoft) {
    box.append(el('a', { class: 'btn primary', href: '/auth/microsoft?next=' + encodeURIComponent(next) }, 'Sign in with Microsoft'),
      el('p', { class: 'small muted' }, 'OIT staff account (' + domains(cfg.microsoft.domains) + ')'));
  }
  if (cfg.google) {
    const holder = el('div', { style: 'display:flex;justify-content:center;margin-top:10px' });
    box.append(holder, el('p', { class: 'small muted' }, 'Google ' + domains(cfg.google.domains) + ' (must be on the consultant list)'));
    const s = el('script', { src: 'https://accounts.google.com/gsi/client', async: true });
    s.onload = () => {
      google.accounts.id.initialize({
        client_id: cfg.google.clientId,
        hd: cfg.google.domains[0],
        callback: async ({ credential }) => {
          try { await api('/api/auth/google', { credential }); location.href = next; } catch (e) { err.textContent = e.message; }
        },
      });
      google.accounts.id.renderButton(holder, { theme: 'outline', size: 'large', text: 'signin_with', width: 320 });
    };
    document.head.append(s);
  }
  if (cfg.devLogin) {
    const input = el('input', { id: 'devEmail', type: 'email', autocomplete: 'email', placeholder: 'you@scarletmail.rutgers.edu', style: 'width:100%' });
    box.append(el('hr'), el('p', { class: 'small' }, el('strong', {}, 'Test mode: '), 'sign in by email only. Turn off DEV_LOGIN in production.'),
      el('form', { onsubmit: async (e) => {
        e.preventDefault();
        try { await api('/api/auth/dev', { email: input.value }); location.href = next; } catch (x) { err.textContent = x.message; }
      } }, el('label', { for: 'devEmail' }, 'Email'), input, el('button', { class: 'btn', type: 'submit' }, 'Test sign-in')),
      el('button', { class: 'btn primary', type: 'button', onclick: async () => {
        try { await api('/api/auth/dev', { skip: true }); location.href = next; } catch (x) { err.textContent = x.message; }
      } }, 'Skip, sign in as test admin'));
  }
  if (!cfg.microsoft && !cfg.google && !cfg.devLogin) {
    box.append(el('p', {}, 'No sign-in method is set up yet. Add Google or Microsoft keys to the server settings.'));
  }
})();
</script>
</body>
</html>
