<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue · OIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Read-only queue for a TV in the waiting area. Sized in vh so it reads from across the room
     on any 16:9 screen, and nothing ever scrolls. */
  :root {
    --paper: #f4f1ec;
    --ink: #141414;
    --soft: #6b665f;
    --rule: #d6d0c6;
    --scarlet: #cc0033;
    --sans: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; cursor: none; user-select: none; }
  .hidden { display: none !important; }

  .screen { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 4vh 4vw 3.5vh; }

  header { display: flex; align-items: baseline; gap: 2.2vw; padding-bottom: 2vh; border-bottom: .35vh solid var(--ink); }
  .word { font-weight: 700; font-size: 2.6vh; position: relative; padding: 1vh 0; cursor: default; }
  .word span { color: var(--scarlet); }
  /* Hidden staff exit, same as the iPad: press and hold the wordmark for 3 seconds. */
  .word::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--scarlet); }
  .word.holding::after { width: 100%; transition: width 3s linear; }
  .place { font-size: 4.6vh; font-weight: 600; letter-spacing: -.01em; }
  .clock { margin-left: auto; font-family: var(--mono); font-size: 3.4vh; color: var(--soft); }
  .offline { font-size: 2vh; color: var(--scarlet); font-weight: 600; display: flex; align-items: center; gap: .6em; }
  .offline::before { content: ""; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); min-height: 0; }
  .list { padding: 3.5vh 3.5vw 0 0; border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  .side { padding: 3.5vh 0 0 3.5vw; display: flex; flex-direction: column; min-height: 0; }

  .label { font-size: 1.9vh; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }

  /* Waiting list: place in line, check-in number, hint, time checked in. */
  .cols, .row { display: grid; grid-template-columns: 7vh minmax(0, 1fr) 12vw 13vw; align-items: baseline; column-gap: 2vw; }
  .cols { padding: 1.4vh 0 1vh; border-bottom: 1px solid var(--rule); }
  .cols span:last-child, .row .at { text-align: right; }
  #rows { min-height: 0; overflow: hidden; }
  .row { padding: 1.7vh 0; border-bottom: 1px solid var(--rule); }
  .row .pos { font-family: var(--mono); font-size: 3.4vh; color: var(--soft); }
  .row .no { font-family: var(--mono); font-size: 6.4vh; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
  .row .no small { font-family: var(--sans); font-size: 2.4vh; font-weight: 500; color: var(--soft); margin-right: .5em; letter-spacing: 0; }
  .row .hint { font-family: var(--mono); font-size: 3.4vh; color: var(--soft); }
  .row .at { font-family: var(--mono); font-size: 3vh; color: var(--soft); }
  .row.next .pos { color: var(--scarlet); font-weight: 600; }
  .row.next .no { color: var(--scarlet); }
  .more { padding: 2vh 0 0; font-size: 2.6vh; color: var(--soft); }
  .empty { padding: 6vh 0 0; }
  .empty b { display: block; font-size: 6vh; font-weight: 600; letter-spacing: -.01em; }
  .empty span { display: block; margin-top: 1.5vh; font-size: 3vh; color: var(--soft); }

  .count { padding: 1vh 0 3.5vh; border-bottom: 1px solid var(--rule); }
  .count b { display: block; font-family: var(--mono); font-size: 19vh; font-weight: 600; line-height: .95; letter-spacing: -.03em; }
  .count b.some { color: var(--scarlet); }
  .count span { font-size: 3.2vh; font-weight: 500; }
  .helping { padding-top: 3vh; min-height: 0; overflow: hidden; }
  #helping { display: flex; flex-wrap: wrap; gap: 1.2vh 2.4vw; margin-top: 1.8vh; }
  #helping div { font-family: var(--mono); font-size: 4.6vh; font-weight: 600; }
  #helping .none { font-family: var(--sans); font-size: 2.8vh; font-weight: 400; color: var(--soft); }

  footer { padding-top: 2vh; border-top: 1px solid var(--rule); font-size: 2.6vh; color: var(--soft); display: flex; justify-content: space-between; gap: 2vw; }
  footer b { color: var(--ink); font-weight: 600; }

  .unlinked { position: fixed; inset: 0; background: var(--paper); display: grid; place-items: center; text-align: center; padding: 6vw; }
  .unlinked b { display: block; font-size: 5vh; margin-bottom: 2vh; }
  .unlinked span { font-size: 2.8vh; color: var(--soft); }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="word" id="word"><span>Rutgers</span> OIT</div>
    <div class="place" id="place"></div>
    <div class="offline hidden" id="offline">Reconnecting</div>
    <div class="clock" id="clock"></div>
  </header>

  <main>
    <section class="list">
      <div class="label">Waiting, in order</div>
      <div class="cols label" id="cols"><span>#</span><span>Check-in no.</span><span>NetID</span><span>Checked in</span></div>
      <div id="rows"></div>
    </section>
    <section class="side">
      <div class="count"><b id="count">0</b><span id="countText">waiting</span></div>
      <div class="helping">
        <div class="label">With a consultant</div>
        <div id="helping"></div>
      </div>
    </section>
  </main>

  <footer>
    <span>Your check-in number was on the iPad after you checked in.</span>
    <span id="tip"></span>
  </footer>
</div>

<div class="unlinked hidden" id="unlinked">
  <div><b>This screen isn't linked to a location.</b><span>A consultant can set it up by signing in at /setup and choosing TV queue screen.</span></div>
</div>

<script src="/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const REFRESH_MS = 5000;
const MAX_ROWS = 7; // more than this and the rest are summed up as "and N more"
const stubNo = (n) => String(n).padStart(3, '0'); // same format as the iPad's confirmation stub

// Staff exit: press and hold "Rutgers OIT" for 3 seconds. Only opens the staff sign-in.
(() => {
  const w = $('word'); let t = null;
  const start = (e) => { e.preventDefault(); w.classList.add('holding'); t = setTimeout(() => { location.href = '/login?next=/setup%3Fas%3Dtv&from=tv'; }, 3000); };
  const stop = () => { clearTimeout(t); w.classList.remove('holding'); };
  w.addEventListener('touchstart', start, { passive: false }); w.addEventListener('mousedown', start);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach((ev) => w.addEventListener(ev, stop));
})();

const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
tick(); setInterval(tick, 10000);

function render(q) {
  $('place').textContent = q.location;
  document.title = `${q.location} queue · OIT`;
  const n = q.waiting.length;
  $('count').textContent = n;
  $('count').classList.toggle('some', n > 0);
  $('countText').textContent = n === 1 ? 'person waiting' : 'people waiting';
  $('cols').classList.toggle('hidden', n === 0);
  $('cols').children[2].textContent = q.waiting.some((w) => w.hint) ? 'Starts with' : '';

  const shown = n > MAX_ROWS ? q.waiting.slice(0, MAX_ROWS - 1) : q.waiting;
  $('rows').replaceChildren(...(n ? [
    ...shown.map((w, i) => el('div', { class: 'row' + (i === 0 ? ' next' : '') },
      el('span', { class: 'pos' }, i + 1),
      el('span', { class: 'no' }, el('small', {}, 'No.'), stubNo(w.no)),
      el('span', { class: 'hint' }, w.hint),
      el('span', { class: 'at' }, fmtTime(w.at)))),
    n > shown.length ? el('div', { class: 'more' }, `and ${n - shown.length} more after them`) : null,
  ].filter(Boolean) : [el('div', { class: 'empty' }, el('b', {}, 'No one is waiting.'), el('span', {}, 'Check in at the iPad and a consultant will be right with you.'))]));

  const h = q.helping.slice(0, 8);
  $('helping').replaceChildren(...(h.length ? h.map((w) => el('div', {}, stubNo(w.no))) : [el('div', { class: 'none' }, 'Nobody right now')]));
  $('tip').textContent = n ? 'When your number moves to the right, a consultant will come find you.' : '';
}

let fails = 0;
async function refresh() {
  try {
    const r = await fetch('/api/tv/queue', { cache: 'no-store' });
    if (r.status === 401) { $('unlinked').classList.remove('hidden'); return; }
    if (!r.ok) throw new Error(r.status);
    $('unlinked').classList.add('hidden');
    render(await r.json());
    fails = 0;
  } catch {
    fails++;
  }
  // Keep showing the last good queue through short blips; flag it after ~15 seconds.
  $('offline').classList.toggle('hidden', fails < 3);
}
refresh();
setInterval(refresh, REFRESH_MS);
// Reload every few hours so the screen picks up app updates without anyone touching it.
setTimeout(() => location.reload(), 6 * 3600e3);
</script>
</body>
</html>
