<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up iPad · OIT Walk-ins</title>
<link rel="stylesheet" href="/app.css">
<style>
  .wrap { max-width: 640px; width: 100%; }
  .eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .wrap h1 { font-size: 2rem; margin: 6px 0 10px; }
  .locs { margin: 24px 0; border-top: 2px solid var(--ink); }
  .locs button { width: 100%; justify-content: space-between; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none;
    padding: 22px 4px; font-size: 1.35rem; font-weight: 600; }
  .locs button:hover, .locs button:active { background: #ebe6de; }
  .locs button .icon { width: 24px; height: 24px; color: var(--muted); }
</style>
</head>
<body class="auth-bg">
<div class="center">
  <div class="wrap">
    <div class="eyebrow">Staff · iPad setup</div>
    <h1>Which location is this iPad at?</h1>
    <p id="current" class="muted"></p>
    <p class="muted">Tap one and the iPad switches to the check-in form. You'll be signed out on it so walk-ins can't see your account.</p>
    <div class="locs" id="locs"></div>
    <p class="error" id="err" role="alert"></p>
    <div class="row">
      <button id="unlink" class="hidden">Unlink this iPad</button>
      <a href="/dashboard" class="small">Go to the queue instead</a>
    </div>
    <p class="small muted">Tip: after setup, turn on Guided Access (Settings › Accessibility) so the iPad stays on the form.</p>
  </div>
</div>
<script src="/common.js"></script>
<script src="/icons.js"></script>
<script>
(async () => {
  const err = document.getElementById('err');
  const me = await api('/api/me');
  if (me.device) {
    document.getElementById('current').textContent = `This iPad is currently linked to ${me.device.location}. Picking a location below replaces that.`;
    const u = document.getElementById('unlink');
    u.classList.remove('hidden');
    u.onclick = async () => {
      if (!confirm('Unlink this iPad? The walk-in form will stop working here until it is set up again.')) return;
      await api('/api/kiosk/unlink', {});
      await api('/api/auth/logout', {});
      location.href = '/login';
    };
  }
  const locs = await api('/api/locations');
  document.getElementById('locs').append(...locs.map((l) => el('button', {
    onclick: async () => {
      try { await api('/api/kiosk/setup', { location_id: l.id }); location.href = '/kiosk'; } catch (e) { err.textContent = e.message; }
    },
  }, l.name, icon('arrow-right'))));
})();
</script>
</body>
</html>
